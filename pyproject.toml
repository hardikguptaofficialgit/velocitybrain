[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "velocitybrain"
version = "0.10.0"
description = "Velocity Brain: agent-first memory and execution engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.7",
  "python-dotenv==1.1.1",
  "apscheduler==3.11.0",
  "pgvector==0.3.6"
]

[project.scripts]
velocitybrain = "src.cli:main"
velocityx = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]
